spring:
  application:
    name: caresphere-ai

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caresphere}
    username: ${DB_USERNAME:caresphere}
    password: ${DB_PASSWORD:caresphere}
    hikari:
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema; Hibernate only validates mappings match the migrations.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    openai:
      # A real OPENAI_API_KEY is required for RAG; the dummy default lets the app start.
      api-key: ${OPENAI_API_KEY:dummy}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.0
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-ada-002}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        distance-type: COSINE_DISTANCE

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

caresphere:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    dir: ${STORAGE_DIR:./caresphere-uploads}
    max-file-size-mb: 10
  jwt:
    # HS256 requires >= 32 bytes. The default is for local dev ONLY; production loads
    # this from AWS Secrets Manager (added in the deployment milestone).
    secret: ${JWT_SECRET:dev-only-do-not-use-in-production-replace-with-a-secure-32-plus-byte-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
  admin:
    # Default bootstrap administrator account, created on startup if no admin exists.
    email: ${ADMIN_EMAIL:admin@caresphere.dev}
    password: ${ADMIN_PASSWORD:Admin12345!}

logging:
  level:
    com.caresphere: INFO
    org.hibernate.SQL: warn
